name: Build Qatar Job App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Qatar Job AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip
          echo "$PWD/gradle-8.11.1/bin" >> $GITHUB_PATH

      - name: Detect package name
        run: |
          PACKAGE=$(grep -m1 '^package ' MainActivity.java | sed 's/package //;s/;//' | tr -d ' ')
          if [ -z "$PACKAGE" ]; then
            PACKAGE="com.qatarjob.app"
          fi
          echo "PACKAGE=$PACKAGE" >> $GITHUB_ENV
          echo "Using package: $PACKAGE"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "QatarJob"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.9.2' apply false
          }
          EOF

          cat > app/build.gradle <<EOF
          plugins {
              id 'com.android.application'
          }

          android {
              namespace "$PACKAGE"
              compileSdk 36

              defaultConfig {
                  applicationId "$PACKAGE"
                  minSdk 23
                  targetSdk 36
                  versionCode 1
                  versionName "1.0"
              }

              signingConfigs {
                  release {
                      storeFile file("qatar-job-release.jks")
                      storePassword "QatarJob2026!"
                      keyAlias "qatarjob"
                      keyPassword "QatarJob2026!"
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

          cp MainActivity.java app/src/main/java/

          if [ -f ic_launcher.png ]; then
            cp ic_launcher.png app/src/main/res/drawable/ic_launcher.png
          fi

          if [ -f ic_launcher_round.png ]; then
            cp ic_launcher_round.png app/src/main/res/drawable/ic_launcher_round.png
          fi

      - name: Create resources
        run: |
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Qatar Job</string>
          </resources>
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="purple_500">#7A003C</color>
              <color name="purple_700">#5A002D</color>
              <color name="white">#FFFFFF</color>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.QatarJob"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">@color/purple_500</item>
                  <item name="android:navigationBarColor">@color/purple_700</item>
                  <item name="android:statusBarColor">@color/purple_700</item>
              </style>
          </resources>
          EOF

      - name: Create AndroidManifest
        run: |
          cat > app/src/main/AndroidManifest.xml <<EOF
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.QatarJob"
                  android:usesCleartextTraffic="false"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher_round">

                  <activity
                      android:name="$PACKAGE.MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      - name: Generate release keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore qatar-job-release.jks \
            -storepass 'QatarJob2026!' \
            -keypass 'QatarJob2026!' \
            -alias qatarjob \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Qatar Job, OU=Qatar Job, O=Qatar Job, L=Doha, ST=Doha, C=QA"

      - name: Build signed AAB
        run: |
          gradle wrapper --gradle-version 8.11.1
          ./gradlew bundleRelease --stacktrace

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Qatar-Job-AAB
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload signing key
        uses: actions/upload-artifact@v4
        with:
          name: Qatar-Job-Signing-Key
          path: qatar-job-release.jks
